project:
  app:
    jwtSecret: eW91cl9jbGllbnRfaWQ6eW91cl9jbGllbnRfc2VjcmV0
    jwtExpirationMs: 86400000

spring:
  application:
    name: auth-service
  cloud:
    config:
      enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5432/auth-service
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8401
  servlet:
    context-path: /apis # Keep this if you want your APIs at /apis

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.netflix.discovery: DEBUG
    com.example: INFO
    org.springframework: INFO
