spring.application.name=IP_Session_001

# Use default naming strategy (Spring Boot 3 auto-converts to snake_case)

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

spring.jpa.hibernate.ddl-auto=update

management.security.enabled=false

spring.datasource.url=jdbc:postgresql://localhost:5432/customer-service
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

server.port=8081
server.servlet.context-path=/apis
