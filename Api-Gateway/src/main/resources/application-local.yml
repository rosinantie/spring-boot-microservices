project:
  app:
    jwtSecret: eW91cl9jbGllbnRfaWQ6eW91cl9jbGllbnRfc2VjcmV0
    jwtExpirationMs: 86400000

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/auth-realm
  application:
    name: api-gateway
  config:
    activate:
      on-profile: local
  cloud:
    config:
      enabled: false
    gateway:
      routes:
        - id: customer-service
          uri: lb://CUSTOMER-SERVICE
          predicates:
            - Path=/apis/customers/** # Forward requests starting with /customers/
        - id: product-service
          uri: lb://PRODUCTS-SERVICE
          predicates:
            - Path=/apis/products/**
        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/apis/orders/**
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/apis/notifications/**
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
              - Path=/apis/user-login/**
server:
  port: 9000
  servlet:
    context-path: /apis

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true

logging:
  level:
    com.netflix.discovery: INFO
    org.springframework.cloud: INFO
