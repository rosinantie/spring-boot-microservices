syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.example.IP_Session_001.grpc";
option java_outer_classname = "NotificationProto";

service NotificationService {
  rpc PlaceNotification (OrderEvent) returns (NotificationResponse);
}

message OrderEvent {
  int64  id         = 1;
  int64  clientId   = 2;
  int64  productId  = 3;
  int32  quantity   = 4;
  double totalPrice = 5;
}

message NotificationResponse {
  string status  = 1;
  string message = 2;
}
