app:
  rabbitmq:
    exchange: order-exchange
    queue: order-queue
    routing-key: order.routing

spring:
  application:
    name: notification-service
  cloud:
    config:
      enabled: false

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  # ===== MongoDB Connection =====
  data:
    mongodb:
      uri: mongodb://localhost:27017/notification_db
      database: notifications

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  security:
    enabled: false
  endpoints:
    web:
      exposure:
        include: "*"
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

server:
  port: 8084
  servlet:
    context-path: /apis

# gRPC server port (separate from HTTP 8084); 9091 avoids the default 9090 collision
grpc:
  server:
    port: 9091
