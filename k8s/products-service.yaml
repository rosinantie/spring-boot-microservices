apiVersion: apps/v1
kind: Deployment
metadata:
  name: products-service
  labels:
    app: products-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: products-service
  template:
    metadata:
      labels:
        app: products-service
    spec:
      containers:
        - name: products-service
          image: products-service:1.0
          imagePullPolicy: IfNotPresent   # use the image we built into minikube, don't pull from a registry
          ports:
            - containerPort: 8082
          env:
            # 'local' profile carries the app config; we override the localhost endpoints below for the cluster
            - name: SPRING_PROFILES_ACTIVE
              value: "local"
            - name: SERVER_PORT
              value: "8082"
            # Reach Eureka by service name inside the cluster (overrides the localhost:8761 in application-local.yaml)
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://discovery-server:8761/eureka"
            # --- PostgreSQL ---
            # JPA ddl-auto=update connects to the DB at startup, so this MUST be reachable or the pod crashes.
            # Postgres runs in Docker on the host, reachable from a pod as host.minikube.internal.
            # If you move Postgres into the cluster, change this to its service name (e.g. jdbc:postgresql://postgres:5432/product-service).
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://host.minikube.internal:5432/product-service"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "password"
            # --- Redis ---
            # Cache type is redis; Spring connects lazily, but it must resolve when the cache is used.
            # Redis runs in Docker on the host, reachable from a pod as host.minikube.internal:6379.
            # If you move Redis into the cluster, change this to its service name (e.g. redis).
            - name: SPRING_DATA_REDIS_HOST
              value: "host.minikube.internal"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            # Zipkin isn't in the cluster yet — turn off trace sampling so the missing collector doesn't spam the logs.
            # Set this to 1.0 (and point the endpoint below at a zipkin service) once tracing is deployed.
            - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
              value: "0.0"
            - name: MANAGEMENT_ZIPKIN_TRACING_ENDPOINT
              value: "http://zipkin:9411/api/v2/spans"
          # This is a SERVLET app with server.servlet.context-path=/apis, which prefixes actuator too,
          # so health is at /apis/actuator/health (NOT /actuator/health like the reactive api-gateway).
          # Hitting the wrong path returns 404 -> liveness kills the pod -> CrashLoop.
          readinessProbe:
            httpGet:
              path: /apis/actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /apis/actuator/health
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: products-service
  labels:
    app: products-service
spec:
  # ClusterIP: this sits behind the api-gateway, so it's internal-only (like config-server / discovery-server).
  # Use `kubectl port-forward svc/products-service 8082:8082` to hit it directly from your laptop.
  selector:
    app: products-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
