apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: order-service:1.0
          imagePullPolicy: IfNotPresent   # use the image we built into minikube, don't pull from a registry
          ports:
            - containerPort: 8083
          env:
            # 'local' profile carries the app config; we override the localhost endpoints below for the cluster
            - name: SPRING_PROFILES_ACTIVE
              value: "local"
            - name: SERVER_PORT
              value: "8083"
            # Reach Eureka by service name inside the cluster (overrides the localhost:8761 in application-local.yml)
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://discovery-server:8761/eureka"
            # --- PostgreSQL ---
            # JPA ddl-auto=update connects to the DB at startup, so this MUST be reachable or the pod crashes.
            # Postgres runs in Docker on the host, reachable from a pod as host.minikube.internal.
            # If you move Postgres into the cluster, change this to its service name (e.g. jdbc:postgresql://postgres:5432/order-service).
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://host.minikube.internal:5432/order-service"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "password"
            # --- RabbitMQ ---
            # The order-queue listener starts at boot, so the broker should be reachable.
            # RabbitMQ runs in Docker on the host, reachable from a pod as host.minikube.internal:5672.
            # If you move RabbitMQ into the cluster, change this to its service name (e.g. rabbitmq).
            - name: SPRING_RABBITMQ_HOST
              value: "host.minikube.internal"
            - name: SPRING_RABBITMQ_PORT
              value: "5672"
            - name: SPRING_RABBITMQ_USERNAME
              value: "admin"
            - name: SPRING_RABBITMQ_PASSWORD
              value: "admin"
            # --- Kafka ---
            # The consumer group connects to the broker on startup.
            # Kafka runs in Docker on the host. It exposes a dedicated MINIKUBE listener on 29092 that
            # advertises itself as host.minikube.internal (see message-broker/docker-compose.yml). Pods MUST
            # use 29092 — the 9092 listener advertises 'localhost', which a pod would resolve to itself.
            # If you move Kafka into the cluster, change this to its service name (e.g. kafka:9092).
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "host.minikube.internal:29092"
            # --- gRPC notification client ---
            # The @GrpcClient("notification-service") channel connects lazily, so the pod boots fine even
            # if the notification-service is down — calls only fail when actually invoked.
            # The notification-service isn't in the cluster yet; it runs in Docker on the host on 9091.
            # NOTE: the net.devh grpc starter keys channels by name (notification-service) via a Map, which
            # cannot be reliably overridden through a hyphenated env var. Point this at the cluster by editing
            # grpc.client.notification-service.address in application-local.yml (e.g. static://notification-service:9091)
            # once the notification-service is deployed.
            # Zipkin isn't in the cluster yet — turn off trace sampling so the missing collector doesn't spam the logs.
            # Set this to 1.0 (and point the endpoint below at a zipkin service) once tracing is deployed.
            - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
              value: "0.0"
            - name: MANAGEMENT_ZIPKIN_TRACING_ENDPOINT
              value: "http://zipkin:9411/api/v2/spans"
          # This is a SERVLET app with server.servlet.context-path=/apis, which prefixes actuator too,
          # so health is at /apis/actuator/health (NOT /actuator/health like the reactive api-gateway).
          # Hitting the wrong path returns 404 -> liveness kills the pod -> CrashLoop.
          readinessProbe:
            httpGet:
              path: /apis/actuator/health
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /apis/actuator/health
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  # ClusterIP: this sits behind the api-gateway, so it's internal-only (like config-server / discovery-server).
  # Use `kubectl port-forward svc/order-service 8083:8083` to hit it directly from your laptop.
  selector:
    app: order-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083