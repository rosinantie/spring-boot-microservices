apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  labels:
    app: config-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          image: config-server:1.0
          imagePullPolicy: IfNotPresent   # use the image we built into minikube, don't pull from a registry
          ports:
            - containerPort: 8888
          env:
            # serve config from the local filesystem (the mounted ConfigMap), NOT git/SSH
            - name: SPRING_PROFILES_ACTIVE
              value: "native"
            - name: SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS
              value: "file:/config"
            # Config-Server pulls in data-jpa but needs no DB — skip DataSource autoconfig so it doesn't crash
            - name: SPRING_AUTOCONFIGURE_EXCLUDE
              value: "org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration"
            - name: SERVER_PORT
              value: "8888"
            - name: SERVER_SERVLET_CONTEXT_PATH
              value: "/apis"
          volumeMounts:
            - name: config-repo
              mountPath: /config
          # No actuator dependency, so use a TCP check: is the port accepting connections?
          readinessProbe:
            tcpSocket:
              port: 8888
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8888
            initialDelaySeconds: 40
            periodSeconds: 15
      volumes:
        - name: config-repo
          configMap:
            name: config-repo      # created from the Config-Repo/ folder (see command below)
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  labels:
    app: config-server
spec:
  selector:
    app: config-server
  ports:
    - name: http
      port: 8888
      targetPort: 8888
