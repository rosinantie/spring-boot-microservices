apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:1.0
          imagePullPolicy: IfNotPresent   # use the image we built into minikube, don't pull from a registry
          ports:
            - containerPort: 9000
          env:
            # 'local' profile carries the gateway routes + disables the config client, so it boots standalone (like Discovery)
            - name: SPRING_PROFILES_ACTIVE
              value: "local"
            - name: SERVER_PORT
              value: "9000"
            # local profile already sets cloud.config.enabled=false; belt-and-suspenders so the config import check can't block startup
            - name: SPRING_CLOUD_CONFIG_ENABLED
              value: "false"
            - name: SPRING_CLOUD_CONFIG_IMPORT_CHECK_ENABLED
              value: "false"
            # Reach Eureka by service name inside the cluster (overrides the localhost:8761 in application-local.yml)
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://discovery-server:8761/eureka"
            # The OAuth2 JWT decoder resolves this lazily (on the first bearer token), so the gateway boots even before Keycloak exists.
            # Point it at the Keycloak service name once Keycloak is deployed in the cluster.
            # Keycloak runs in Docker on the host, reachable from a pod as host.minikube.internal
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: "http://host.minikube.internal:8180/realms/auth-realm"
            # Zipkin isn't in the cluster yet — turn off trace sampling so the missing collector doesn't spam the logs.
            # Set this to 1.0 (and point the endpoint below at a zipkin service) once tracing is deployed.
            - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
              value: "0.0"
            - name: MANAGEMENT_ZIPKIN_TRACING_ENDPOINT
              value: "http://zipkin:9411/api/v2/spans"
          # actuator is on the classpath; WebFlux ignores the servlet context-path, so health is at /actuator/health
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 9000
            initialDelaySeconds: 40
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  # NodePort so the gateway (the cluster's front door) is reachable from your laptop via `minikube service`
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 9000
      targetPort: 9000